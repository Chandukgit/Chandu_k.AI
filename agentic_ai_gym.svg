<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0a1520" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="emeraldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="glow2" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <filter id="blurFilter2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad2)" />
  <circle cx="580" cy="180" r="180" fill="url(#glow2)" filter="url(#blurFilter2)" />

  <!-- Grid pattern -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Title Pill Header -->
  <g transform="translate(40, 36)">
    <rect width="210" height="30" rx="15" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="1.2" />
    <circle cx="16" cy="15" r="5" fill="#10b981" />
    <text x="30" y="20" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">RL GYM EVALUATION</text>
  </g>

  <!-- Main Window Frame -->
  <g transform="translate(40, 85)">
    <rect width="720" height="355" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.5" />
    
    <!-- Window Bar -->
    <rect width="720" height="42" rx="16" fill="#1e293b" fill-opacity="0.7" />
    <circle cx="24" cy="21" r="5" fill="#ef4444" />
    <circle cx="40" cy="21" r="5" fill="#eab308" />
    <circle cx="56" cy="21" r="5" fill="#22c55e" />
    <text x="80" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Agentic AI Evaluation • Multi-Step Reasoning &amp; Tool Verification Harness</text>

    <!-- Workflow Block 1: Scenario & Agent Brain -->
    <g transform="translate(30, 65)">
      <rect width="150" height="110" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="14" y="28" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">MULTI-STEP SCENARIO</text>
      <text x="14" y="50" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Agent Planning</text>
      <text x="14" y="68" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Tool Calling Chain</text>
      <rect x="14" y="82" width="120" height="18" rx="4" fill="#10b981" fill-opacity="0.2" />
      <text x="20" y="95" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600">Step Decomposition</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 190 120 L 215 120" stroke="#10b981" stroke-width="2" stroke-dasharray="4 3" />

    <!-- Workflow Block 2: RL Gym Environment -->
    <g transform="translate(220, 65)">
      <rect width="145" height="110" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
      <text x="14" y="28" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">RL GYM SIMULATOR</text>
      <rect x="14" y="42" width="117" height="24" rx="4" fill="#0284c7" fill-opacity="0.2" />
      <text x="20" y="58" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Action Execution</text>
      <rect x="14" y="74" width="117" height="24" rx="4" fill="#0369a1" fill-opacity="0.25" />
      <text x="20" y="90" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">State Transition</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 375 120 L 400 120" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3" />

    <!-- Workflow Block 3: Verification Harness -->
    <g transform="translate(405, 65)">
      <rect width="140" height="110" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="14" y="28" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">SQL TEST HARNESS</text>
      <text x="14" y="52" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Automated Validation</text>
      <text x="14" y="70" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">State Integrity Check</text>
      <rect x="14" y="82" width="112" height="18" rx="4" fill="#eab308" fill-opacity="0.2" />
      <text x="20" y="95" fill="#fde047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600">SQL Assertions</text>
    </g>

    <!-- Arrow 3 -->
    <path d="M 555 120 L 580 120" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 3" />

    <!-- Workflow Block 4: Evaluation Benchmark -->
    <g transform="translate(585, 65)">
      <rect width="105" height="110" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" />
      <text x="10" y="28" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">ENTERPRISE CLIENTS</text>
      <text x="10" y="52" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Meta • Apple</text>
      <text x="10" y="70" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Amazon</text>
      <rect x="10" y="82" width="85" height="18" rx="4" fill="#a855f7" fill-opacity="0.2" />
      <text x="15" y="95" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">Turing Platform</text>
    </g>

    <!-- Evaluation Execution Log Panel -->
    <g transform="translate(30, 195)">
      <rect width="660" height="135" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />
      
      <!-- Terminal Log Header -->
      <g transform="translate(18, 16)">
        <text x="0" y="14" fill="#94a3b8" font-family="Courier, monospace" font-size="11" font-weight="600">[RUNNER] Initializing RL-Gym Environment: multi_step_db_admin_v2</text>
      </g>
      
      <!-- Test Execution Details -->
      <g transform="translate(18, 42)">
        <text x="0" y="14" fill="#38bdf8" font-family="Courier, monospace" font-size="11">STEP 1: Agent dispatched tool_call `fetch_schema` -> Status: SUCCESS</text>
        <text x="0" y="32" fill="#38bdf8" font-family="Courier, monospace" font-size="11">STEP 2: Agent parsed foreign keys and drafted query -> Status: SUCCESS</text>
        <text x="0" y="50" fill="#34d399" font-family="Courier, monospace" font-size="11">STEP 3: SQL Test Harness executed state verification -> 14/14 Assertions PASSED</text>
      </g>

      <!-- Results Badges Row -->
      <g transform="translate(18, 102)">
        <rect x="0" y="0" width="135" height="22" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
        <text x="10" y="15" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">✓ Task Completion: 100%</text>

        <rect x="145" y="0" width="155" height="22" rx="4" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1" />
        <text x="155" y="15" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">✓ Tool Syntax: 0 Errors</text>

        <rect x="310" y="0" width="165" height="22" rx="4" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1" />
        <text x="320" y="15" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">✓ Reasoning Verified</text>

        <rect x="485" y="0" width="155" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="495" y="15" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Agile / Scrum Sprint</text>
      </g>
    </g>

  </g>
</svg>
