<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="primaryGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="cyanGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <radialGradient id="glow1" cx="65%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <filter id="blurFilter1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad1)" />
  <circle cx="560" cy="180" r="180" fill="url(#glow1)" filter="url(#blurFilter1)" />

  <!-- Grid pattern overlay -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Title Pill Header -->
  <g transform="translate(40, 36)">
    <rect width="180" height="30" rx="15" fill="#6366f1" fill-opacity="0.18" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="16" cy="15" r="5" fill="#10b981" />
    <text x="30" y="20" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">ENTERPRISE RAG</text>
  </g>

  <!-- Main Architecture Card Mockup -->
  <g transform="translate(40, 85)">
    <!-- Main Window Frame -->
    <rect width="720" height="355" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.5" />
    
    <!-- Window Bar -->
    <rect width="720" height="42" rx="16" fill="#1e293b" fill-opacity="0.7" />
    <circle cx="24" cy="21" r="5" fill="#ef4444" />
    <circle cx="40" cy="21" r="5" fill="#eab308" />
    <circle cx="56" cy="21" r="5" fill="#22c55e" />
    <text x="80" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Banking RM Knowledge Assistant • Hybrid Retrieval Pipeline</text>

    <!-- Pipeline Flow Diagrams -->
    <!-- Step 1: Ingestion -->
    <g transform="translate(30, 65)">
      <rect width="145" height="110" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="14" y="28" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">DOCUMENT INGESTION</text>
      <text x="14" y="50" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Banking Policies</text>
      <text x="14" y="68" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">RM Guidelines</text>
      <rect x="14" y="82" width="115" height="18" rx="4" fill="#3b82f6" fill-opacity="0.2" />
      <text x="20" y="95" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600">Semantic Chunking</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 185 120 L 210 120" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)" />
    
    <!-- Step 2: Hybrid Indexing -->
    <g transform="translate(215, 65)">
      <rect width="145" height="110" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" />
      <text x="14" y="28" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">HYBRID RETRIEVAL</text>
      <rect x="14" y="42" width="117" height="24" rx="4" fill="#6366f1" fill-opacity="0.2" />
      <text x="20" y="58" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Vertex AI Vector</text>
      <rect x="14" y="74" width="117" height="24" rx="4" fill="#8b5cf6" fill-opacity="0.2" />
      <text x="20" y="90" fill="#ddd6fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">BM25 Keyword Search</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 370 120 L 395 120" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 3" />

    <!-- Step 3: Reranker -->
    <g transform="translate(400, 65)">
      <rect width="135" height="110" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="14" y="28" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">RERANKING</text>
      <text x="14" y="52" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Cross-Encoder</text>
      <text x="14" y="70" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Top-k Context Filter</text>
      <rect x="14" y="82" width="107" height="18" rx="4" fill="#0284c7" fill-opacity="0.25" />
      <text x="20" y="95" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600">Relevance Score</text>
    </g>

    <!-- Arrow 3 -->
    <path d="M 545 120 L 570 120" stroke="#10b981" stroke-width="2" stroke-dasharray="4 3" />

    <!-- Step 4: Generation with Citations -->
    <g transform="translate(575, 65)">
      <rect width="115" height="110" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
      <text x="12" y="28" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">LLM GENERATION</text>
      <text x="12" y="50" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Source Citations</text>
      <text x="12" y="68" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Context Grounded</text>
      <rect x="12" y="82" width="91" height="18" rx="4" fill="#10b981" fill-opacity="0.2" />
      <text x="18" y="95" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">Zero Hallucination</text>
    </g>

    <!-- Interactive Prompt / Output Simulator Panel -->
    <g transform="translate(30, 195)">
      <rect width="660" height="135" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />
      
      <!-- Query Row -->
      <g transform="translate(18, 16)">
        <rect width="46" height="20" rx="4" fill="#3b82f6" fill-opacity="0.25" />
        <text x="8" y="14" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">QUERY</text>
        <text x="56" y="15" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">"What are the compliance loan underwriting thresholds for Tier-1 Commercial Accounts?"</text>
      </g>
      
      <!-- Response Row -->
      <g transform="translate(18, 48)">
        <rect width="66" height="20" rx="4" fill="#10b981" fill-opacity="0.25" />
        <text x="8" y="14" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">RESPONSE</text>
        <text x="76" y="15" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Commercial Tier-1 accounts require a minimum DSCR of 1.35x and audited balance sheets for 3 fiscal years.</text>
      </g>

      <!-- Citations Pill row -->
      <g transform="translate(18, 88)">
        <text x="0" y="18" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Verified Sources:</text>
        <rect x="100" y="3" width="175" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="110" y="18" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">📄 Policy_Handbook_v4.2 § 8.1</text>
        
        <rect x="285" y="3" width="185" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="295" y="18" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">📄 Commercial_Underwrite_2025</text>
        
        <rect x="480" y="3" width="140" height="22" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
        <text x="490" y="18" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">✓ Grounded Context</text>
      </g>
    </g>

  </g>
</svg>
